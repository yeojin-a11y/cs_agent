<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이 CS 답변 도우미</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
.container{width:100%;max-width:760px}
header{margin-bottom:28px;text-align:center}
header h1{font-size:22px;font-weight:700;color:#1d1d1f}
header p{margin-top:6px;font-size:14px;color:#6e6e73}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:20px}
label{display:block;font-size:13px;font-weight:600;color:#1d1d1f;margin-bottom:8px}
select,textarea,input{width:100%;font-family:inherit;font-size:15px;border:1.5px solid #d2d2d7;border-radius:10px;padding:12px 14px;color:#1d1d1f;background:#fafafa;outline:none;transition:border-color .2s}
select:focus,textarea:focus,input:focus{border-color:#0071e3;background:#fff}
textarea{resize:vertical;min-height:130px;line-height:1.6}
.field+.field{margin-top:20px}
.char-count{text-align:right;font-size:12px;color:#aeaeb2;margin-top:5px}
.btn-primary{width:100%;padding:15px;background:#0071e3;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s,opacity .2s;margin-top:8px}
.btn-primary:hover{background:#0077ed}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.result-card{display:none}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.result-header span{font-size:13px;font-weight:600;color:#1d1d1f}
.badge{font-size:12px;padding:3px 10px;background:#e8f4fd;color:#0071e3;border-radius:20px;font-weight:500}
#answerBox{background:#f5f5f7;border-radius:10px;padding:18px;font-size:14px;line-height:1.75;color:#1d1d1f;white-space:pre-wrap;word-break:break-word;min-height:80px}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid #d2d2d7;background:#fff;color:#1d1d1f;transition:background .15s}
.actions button:hover{background:#f5f5f7}
.actions button.dark{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.actions button.dark:hover{background:#333}
.spinner{display:inline-block;width:17px;height:17px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#1d1d1f;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;font-weight:500;opacity:0;transition:transform .3s,opacity .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.error-msg{color:#ff3b30;font-size:13px;margin-top:10px;display:none}
/* API Key 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:20px;padding:32px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:8px;color:#1d1d1f}
.modal p{font-size:13px;color:#6e6e73;margin-bottom:20px;line-height:1.6}
.modal a{color:#0071e3;text-decoration:none}
.modal a:hover{text-decoration:underline}
</style>
</head>
<body>

<!-- API Key 입력 모달 -->
<div class="modal-overlay" id="keyModal">
  <div class="modal">
    <h2>🔑 Gemini API 키 입력</h2>
    <p>파이 CS 답변 도우미를 사용하려면 Gemini API 키가 필요합니다.<br>
    키는 이 탭에서만 유지되며 서버에 저장되지 않습니다.<br><br>
    키 발급: <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></p>
    <div class="field">
      <label for="apiKeyInput">API 키</label>
      <input type="password" id="apiKeyInput" placeholder="AIza...">
    </div>
    <button class="btn-primary" style="margin-top:16px" onclick="saveKey()">시작하기</button>
    <div class="error-msg" id="keyError">API 키를 입력해주세요.</div>
  </div>
</div>

<div class="container">
  <header>
    <h1>파이 CS 답변 도우미</h1>
    <p>고객 문의 내용을 입력하면 AI가 답변 초안을 생성합니다</p>
  </header>

  <div class="card">
    <div class="field">
      <label for="question">고객 문의 내용</label>
      <textarea id="question" placeholder="고객이 문의한 내용을 입력하세요..."></textarea>
      <div class="char-count"><span id="charCount">0</span>자</div>
    </div>
    <button class="btn-primary" id="generateBtn" onclick="generate()">답변 초안 생성</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="card result-card" id="resultCard">
    <div class="result-header">
      <span>생성된 답변 초안</span>
      <span class="badge" id="categoryBadge" style="display:none"></span>
    </div>
    <div id="answerBox"></div>
    <div class="actions">
      <button onclick="copyAnswer()">📋 복사</button>
      <button class="dark" onclick="generate()">🔄 다시 생성</button>
    </div>
  </div>

  <p style="text-align:center;font-size:12px;color:#aeaeb2;margin-top:4px">
    <a href="#" onclick="resetKey()" style="color:#aeaeb2">API 키 변경</a>
  </p>
</div>

<div class="toast" id="toast">클립보드에 복사됐어요</div>

<script>
const GUIDE_DATA = `
=== 파이 서비스 이용가이드 ===

[1. 파이 이용 방법 안내]
파이는 자녀의 자산 관리를 쉽고 체계적으로 할 수 있는 서비스입니다.
STEP1: 자녀 프로필 등록 — 자녀 정보 입력 후 +버튼으로 프로필 등록
STEP2: 증여 계획 세우기 — 10년간 증여세 없이 증여할 수 있는 금액 확인, 공제 한도를 채우는 것을 목표로 증여 계획 수립
STEP3: 증여+투자 패키지 신청 — 증여 시기, 금액, 투자처를 한 번에 설정
STEP4: 증여세 셀프신고 및 자산 관리 — 설정된 날짜에 자동 실행, 증여세 신고 간편 진행

[2. 증여+투자 패키지 시작하기]
증여 금액을 투자 종목(1종)에 연결하는 파이만의 서비스. 증여 내역 자동 증빙 및 무료 증여세 신고 지원. 분산 투자 원하면 여러 패키지 신청 가능.
5단계 신청 프로세스:
- STEP1: 증여 방법(매월 소액 or 일시금) 및 금액 선택
- STEP2: 증여일, 기간 설정 (10년 권장)
- STEP3: 파이×한화투자증권 전용 계좌 개설 (부모·자녀 동시)
- STEP4: 자동이체 계좌 등록 (부모 명의)
- STEP5: 투자 종목 선택 및 투자성향 분석 완료
실행 순서: 입금 → 주문 → 매수완료 → 출금

[3. 간편 증여세 셀프신고]
홈택스 증여세 신고를 간소화. 별도 비용 없이 클릭 몇 번으로 신고 완료.
신고가 필요한 이유:
- 자금 출처 증명: 향후 자녀 부동산 구매 시 자금 출처 정당성 입증
- 투자 수익 보호: 신고 없으면 투자로 불어난 금액 전체가 증여금으로 간주될 수 있음. 미리 신고하면 초기 증여액만 인정, 이후 수익은 자녀 몫
6단계 신고 절차:
1. 증여+투자 패키지 신청(자동이체 방식)
2. 증여금 입금 시 알림톡 수신
3. 자녀의 홈택스 계정 생성 및 로그인
4. 증여 정보 및 신고 금액 확인(공제 한도 자동 계산)
5. 신고 서류 확인 및 제출
6. 홈택스 접수 완료
주요 특징: 10년 합산 한도 자동 계산, 통장 거래내역서·증여금 평가 명세서 등 필요 서류 파이가 준비, 공제 한도 내에서도 신고 필수

[4. 세금없이 2.4억+α 물려주는 법]
공식1: 자녀명의 계좌 증여
- 미성년 자녀: 10년 기준 2천만 원까지 세금 면제
- 성년 자녀: 10년 기준 5천만 원까지 세금 면제
- 결혼·출산 시: 추가로 최대 1억 원 가능
- 합계: 증여금 총 2.4억 원, 증여세 0원
공식2: 유기정기금(적립식) 증여
- 미성년 자녀: 월 19만 4천 원으로 10년간 적립 시 2,320만 원 증여 가능
- 성년 자녀: 월 47만 8천 원으로 5,730만 원 증여 가능 (연 3% 할인율 적용)
공식3: 장기투자 운용 — 복리 효과로 30세까지 운용 시 원금 2.4억 원 이상 자산 형성 가능

[5. 미국 ETF 입문 가이드]
ETF: 주식처럼 사고팔 수 있는 펀드. 미국 대표 기업 수십 곳에 한 번에 투자.
ETF 장점: 분산 효과 높음, 거래 비용 낮음(0.01~0.5%), 즉시 환금 가능
S&P500 지수: 수십 년간 연평균 7~10% 수준 수익률 기록
포트폴리오 전략:
- 안정형: 핵심 지수 ETF 100%
- 공격형: 핵심 지수 ETF 60~70% + 테마·배당 ETF 30~40%
대표 ETF: VOO(Vanguard S&P500, 운용보수 0.03%), QQQM(나스닥100, 0.15%), SCHD(배당), XLK(기술), XLV(헬스케어)
레버리지 ETF: 단기 트레이딩용, 장기 아동 투자에 부적합 (변동성 잠식·가격 괴리·높은 비용 위험)
핵심 원칙: 완벽한 타이밍보다 오늘의 시작이 중요, 소액 장기 적립이 효과적

니다.\n- 고객님께서는 현재 증여재산 공제한도를 모두 사용하신 상태로 확인되어, 추가 증여 시 세금이 발생할 수 있는 만큼 신중한 검토를 권해드립니다.\n- 또한 파이 앱의 간편신고는 공제한도를 초과한 증여에 대해서는 지원되지 않는 점도 참고 부탁드립니다.\n\n[한화투자증권 앱에서 자녀 계좌 로그인 방법]\n- '한투증권'은 한화투자증권 모바일앱(MTS)을 말씀하시는 것으로 이해됩니다.\n- 부모님 ID로는 부모 계좌만 조회되며, 자녀 계좌는 부모님 ID와 별개로 '자녀 ID'를 따로 생성하셔야 로그인하실 수 있습니다.\n- 자녀 ID 생성: 한화투자증권 MTS 앱 > 로그인 화면 [다른 로그인 방법] > [아이디] > [ID 등록] > 자녀 정보(이름/계좌번호/계좌비밀번호) 입력 후 ID 생성·로그인\n- 로그인이나 계좌 관련하여 더 자세한 확인이 필요하시면, 계좌를 관리하는 한화투자증권 고객센터(080-851-8282)로 문의하시면 도움받으실 수 있습니다.\n\n고객님의 상황을 정확히 이해한 것이 맞는지 확인 부탁드리며, 위 내용 외에 궁금하신 점이 있으시면 언제든 편하게 말씀해 주세요.\n감사합니다.\n\n파이 고객센터 드림", "안녕하세요, 파이 고객센터입니다.\n\n먼저 서비스 이용 중에 불편을 겪게 해드려 진심으로 죄송합니다.\n\n파이 앱을 통해 진행되는 비대면 계좌 개설은 제휴 증권사인 한화투자증권을 통해 진행되며, 고객님의 소중한 정보 보호를 위해 대법원 시스템 연동을 통한 가족관계 정보 검증 절차를 거치게 됩니다.\n다만, 이 과정에서 가족관계 정보에 변동이 있으신 경우 온라인 검증의 제약으로 인해 비대면 계좌 개설이 제한될 수 있습니다.\n\n파이 역시 이러한 상황에서도 고객분들께서 원활하게 계좌를 개설하실 수 있도록, 제휴사와 긴밀히 협력하여 시스템 개선을 최우선으로 검토 중에 있습니다. 빠른 시일 내에 더욱 편리하게 이용하실 수 있도록 최선을 다하겠습니다.\n\n소중한 시간 내어 문의해 주셨으나 바로 도움을 드리지 못한 점 너른 양해를 부탁드립니다.\n\n감사합니다.\n\n파이 고객센터 드림", "안녕하세요, 파이 고객센터입니다.\n\n아이 계좌 개설 중 가족관계 검증 단계에서 불편을 드려 죄송합니다. 계좌 운용사인 제휴사 한화투자증권을 통해 상세한 확인이 필요하여 답변이 늦어지게 된 점 양해 부탁드립니다.\n현재 한화투자증권은 비대면 계좌 개설 시 대법원 시스템과 연동하여 가족관계증명서를 검증하고 있습니다. 이 과정에서 가족 정보에 변동 내역이 있으신 경우 시스템을 통한 자동 검증이 어려워, 부득이하게 한화투자증권 오프라인 지점 방문을 통해서 계좌개설 처리를 도와드리고 있습니다. 다만 파이X한화투자증권 간편증여 계좌의 경우 제휴 계좌 특성상 현재 지점을 통한 신청 프로세스가 마련되어 있지 않아, 고객님들께서 어려움 없이 계좌를 개설하실 수 있도록 다각도로 대안을 검토하고 있는 것으로 확인하였습니다.\n즉시 해결해 드리지 못한 점 거듭 사과드리며, 추후 해당 서비스가 개선되는 경우 앱을 통해 빠르게 안내해 드릴 수 있도록 하겠습니다.\n\n파이 고객센터 드림"], "회원정보": ["안녕하세요, 파이 고객센터입니다.\n\n파이 앱 회원 탈퇴 방법을 안내드립니다. \n\n[앱 회원 탈퇴]\n1. 앱 하단의 [MY] 탭 선택\n2. [탈퇴하기] 메뉴 선택\n3. [탈퇴하기] 버튼 터치 → 간편인증(비밀번호 또는 생체인증) 진행\n\n간편인증 완료 후 앱 초기 화면(본인인증 화면)으로 이동하면 정상적으로 탈퇴가 완료된 것입니다. 고객님께서 가입 시 입력하셨던 회원 정보는 탈퇴 즉시 안전하게 삭제 처리됩니다.\n단, 파이를 통해 계좌를 개설하신 경우에는 한화투자증권 앱을 통해 별도로 계좌를 폐쇄해 주셔야 합니다.\n계좌 서비스는 제휴사인 한화투자증권을 통해 제공해 드리고 있어 번거로우시겠지만 아래 경로를 통해 직접 처리해주셔야 하는 점 너른 양해 부탁드립니다. \n\n[계좌폐쇄 안내]\n경로: 한화투자증권 앱 설치 및 실행 &gt; 고객서비스 &gt; 계좌정보관리 &gt; 계좌폐쇄\n\n\n이용해  ["안녕하세요, 파이 고객센터입니다.\n문의 주셔서 감사합니다. 문의주신 내용에 대해 아래와 같이 안내드리겠습니다.\n\n[추가 신청 가능 여부 안내] \n현재 월 10만원 적립식 패키지를 이용 중이신 경우에도, 여유 자금이 생기시면 추가로 패키지를 신청하실 수 있습니다. 일시금과 적립식 모두 추가 신청이 가능하오니 편하신 방식으로 진행해주세요.\n\n[참고: 증여재산 공제한도 안내] \n부모-자녀 간 증여 시에는 10년 주기로 증여재산 공제한도가 적용됩니다. 미성년 자녀의 경우 공제한도는 2,000만원이며, 해당 한도 내에서 자유롭게 추가 신청하실 수 있습니다.\n\n[남은 공제한도 확인 방법] \n현재 자녀의 남은 공제한도는 파이 홈 화면에서 자녀의 홈택스 계정을 연동하시면 확인 가능합니다. 연동 경로는 아래와 같습니다.\n- 홈택스 로그인 이력이 있는 경우: 홈 > 「증여세 신고금액」 > 우측 [리프레쉬] 아이콘 클릭 > 「홈택스 계정 연결」에서 [홈택스 로그인하기] 클릭 후 홈택스 아이디/PW 로그인\n- 홈택스 로그인 이력이 없는 경우: 홈 > 「증여세 신고금액」 > 화면 내 「홈택스 연결하기」 버튼 선택\n\n혹시 저희가 고객님의 상황을 정확히 이해하지 못한 부분이 있거나, 위 안내 외에 추가로 궁금하신 사항이 있으시다면 언제든 다시 말씀해주세요. 상세히 확인하여 도움드리겠습니다.\n어려움이 지속된다면 언제든 다시 문의해주세요. 감사합니다.\n\n파이고객센터 드림", "안녕하세요, 파이 고객센터입니다.\n\n파이에서는 자녀 계좌로 증여금이 입금되면 당일 종목 주문이 접수되며, 다음 날 체결이 완료되어 자산 현황에 반영됩니다.\n\n고객님께서 26일에 증여금 출금을 설정하셨다면, 정상적으로 체결이 완료된 종목은 27일(오늘) 자녀의 자산 현황 메뉴에서 확인하실 수 있습니다.파이 앱에서 아이의 든든한 증여+투자가 잘 이루어졌는지 확인해 보세요\n\n이용하시면서 더 궁금한 점이 있으시면 언제든 편하게 문의해 주세요.\n감사합니다.\n\n파이 고객센터 드림", "안녕하세요, 파이 고객센터입니다.\n소중한 자녀의 자산 형성을 위해 파이를 선택해 주셔서 진심으로 감사드립니다.\n\n아쉽지만 신청하신 패키지가 실행되기 전(자녀계좌로 입금되기 전)에는 기존 설정 정보의 수정이 어렵습니다. 번거로우시더라도 기존 패키지를 취소하신 후, 새로 패키지를 신청하시면서 출금 계좌를 변경 부탁드립니다.\n\n특히 고객님께서는 6월 1일 출금 실행으로 신청해 두셨는데, 출금 실행 하루 전에는 시스템상 취소가 불가능합니다. 이점 참고하셔서 가급적 빠르게 아래 경로에 따라 패키지를 취소하신 후 재신청해 주시면 감사하겠습니다.\n\n[패키지 취소 및 인출계좌 변경 방법]\n1. 앱 홈 화면에서 '우리 아이 자산' 영역에 보이는 '신청 중인 증여+투자 패키지'를 누릅니다.\n2. 화면 우측 상단에 있는 '투자 취소' 버튼을 눌러 패키지를 취소합니다.\n3. 홈 화면에서 증여+투자 패키지를 다시 신청하면, 신청 과정에서 출금계좌 신규 추가 화면이 노출됩니다. 이때 변경하실 계좌를 새로 등록하시면 됩니다.\n\n계좌 변경 과정에서 잘 안되시거나 더 궁금한 점이 있으시면 언제든 편하게 문의해 주세요.\n감사합니다.\n\n파이 고객센터 드림", "안녕하세요, 파이 고객센터입니다.\n\n먼저 서비스 이용에 불편을 드려 죄송합니다.\n파이 서비스는 고객님의 정보를 안전하게 보호하기 위해 대법원 시스템을 통해 가족관계 정보를 검증하고 있습니다.\n정보 오류가 발생한 경우 아래 케이스에 해당하는지 확인을 부탁드립니다.\n\n1) 입력 정보가 맞는지 확인해주세요\n2) 가족 정보에 변동이 있는 경우 온라인 검증 제약으로 인해 비대면 계좌 개설이 제한됩니다. 대응할 수 있는 지원 프로세스를 최우선으로 검토 중에 있으니 양해 부탁드립니다.\n\n빠른 시일 내 개선을 통해 불편 없이 이용하실 수 있도록 하겠습니다.\n감사합니다.\n\n파이 고객센터 드림", "안녕하세요, 파이 고객센터입니다.\n\n고객님의 정보 확인 결과, 월 19만 4천 원 패키지로 신청하시고 홈택스 신고까지 완료해 주신 상태입니다. 아동수당을 활용하기 위해 패키지 정보나 홈택스 신고 내역을 수정하실 필요는 없습니다.\n\n아동수당 10만 원을 증여 자금으로 활용하시려면, 아동수당이 입금되는 계좌를 증여+투자 패키지의 출금 계좌로 변경해 주시면 됩니다. 이렇게 설정해두면 아동수당 10만 원이 자동으로 증여 자금에 합쳐져, 부모님 부담은 9만 4천 원으로 줄어듭니다.\n\n[설정 방법]\n1단계. 파이 앱에서 증여+투자 패키지에 설정된 '출금 계좌'의 은행명과 계좌번호를 확인해 주세요.\n2단계. 복지로 웹사이트에서 아동수당 입금 계좌를 변경합니다.\n- 복지로 홈페이지 접속 → <https://www.bokjiro.go.kr/>\n- 로그인 (간편로그인 가능)\n- 상단 메뉴 [서비스 신청] → [민원서비스 신청] → [복지급여계좌변경] 클릭\n- 아동수당(10만 원)의 수취 계좌를 1단계에서 확인한 계좌로 변경 신청\n※ 계좌 변경 반영 시점은 지자체에 따라 다를 수 있어, 계좌변경 신청 후 안내되는 적용일을 함께 확인하시는 것을 권장드립니다.\n\n[참고] \n아동수당 지급이 종료되는 시점부터는 부모님 계좌에서 아동수당이 포함되지 않은 19만 4천 원이 출금됩니다. 자녀를 위한 증여 계획 수립 시 참고해 주세요.\n\n혹시 저희가 고객님의 상황을 정확히 이해하지 못한 부분이 있거나, 위 안내 외에 추가로 궁금하신 점이 있으시면 언제든 편하게 문의해 주세요. 감사합니다.\n\n파이 고객센터 드림"]};

function saveKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { document.getElementById('keyError').style.display='block'; return; }
  sessionStorage.setItem('gemini_key', key);
  document.getElementById('keyModal').style.display='none';
}

function resetKey() {
  sessionStorage.removeItem('gemini_key');
  document.getElementById('keyModal').style.display='flex';
}

${exText}

위 규칙을 반드시 지키면서, 이용가이드의 정확한 정보를 바탕으로 참고 사례의 말투와 형식을 따라 답변을 작성해주세요.`;
}

async function generate() {
  const question = document.getElementById('question').value.trim();
  const apiKey = sessionStorage.getItem('gemini_key');
  const errorEl = document.getElementById('errorMsg');

  errorEl.style.display='none';
  if (!question) { showError('문의 내용을 입력해주세요.'); return; }
  if (!apiKey) { document.getElementById('keyModal').style.display='flex'; return; }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>생성 중...';

  try {
    const examples = getExamples(question);
    const prompt = buildPrompt(question, examples);

    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          contents: [{parts: [{text: prompt}]}],
          generationConfig: {temperature: 0.4, maxOutputTokens: 1024}
        })
      }
    );

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || '오류');
    }

    const data = await res.json();
    let answer = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    answer = answer.replace(/\*\*(.*?)\*\*/g, '$1').trim();

    document.getElementById('answerBox').textContent = answer;

    const rc = document.getElementById('resultCard');
    rc.style.display = 'block';
    rc.scrollIntoView({behavior:'smooth', block:'start'});

  } catch(e) {
    showError('오류: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '답변 초안 생성';
  }
}

function copyAnswer() {
  const text = document.getElementById('answerBox').textContent;
  navigator.clipboard.writeText(text).then(() => showToast());
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
