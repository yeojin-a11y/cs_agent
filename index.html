<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이 CS 답변 도우미</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
.container{width:100%;max-width:760px}
header{margin-bottom:28px;text-align:center}
header h1{font-size:22px;font-weight:700;color:#1d1d1f}
header p{margin-top:6px;font-size:14px;color:#6e6e73}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:20px}
label{display:block;font-size:13px;font-weight:600;color:#1d1d1f;margin-bottom:8px}
textarea{width:100%;font-family:inherit;font-size:15px;border:1.5px solid #d2d2d7;border-radius:10px;padding:12px 14px;color:#1d1d1f;background:#fafafa;outline:none;transition:border-color .2s;resize:vertical;min-height:130px;line-height:1.6}
textarea:focus{border-color:#0071e3;background:#fff}
.char-count{text-align:right;font-size:12px;color:#aeaeb2;margin-top:5px}
.btn-primary{width:100%;padding:15px;background:#0071e3;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s,opacity .2s;margin-top:8px}
.btn-primary:hover:not(:disabled){background:#0077ed}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.result-card{display:none}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.result-header span:first-child{font-size:13px;font-weight:600;color:#1d1d1f}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:500;display:none}
.badge.conf-high{background:#e8f4fd;color:#0071e3}
.badge.conf-medium{background:#fff4e5;color:#c76a00}
.badge.conf-low{background:#f0f0f2;color:#6e6e73}
#answerBox{background:#f5f5f7;border-radius:10px;padding:18px;font-size:14px;line-height:1.75;color:#1d1d1f;white-space:pre-wrap;word-break:break-word;min-height:80px}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid #d2d2d7;background:#fff;color:#1d1d1f;transition:background .15s}
.actions button:hover{background:#f5f5f7}
.actions button.dark{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.actions button.dark:hover{background:#333}
details{margin-top:14px}
summary{font-size:13px;color:#6e6e73;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸ ';transition:transform .2s}
details[open] summary::before{content:'▾ '}
#refList{list-style:none;margin-top:10px;padding-left:14px}
#refList li{display:flex;justify-content:space-between;font-size:13px;color:#1d1d1f;padding:6px 0;border-bottom:1px solid #f0f0f2}
#refList li:last-child{border-bottom:none}
.ref-score{color:#6e6e73;font-variant-numeric:tabular-nums}
.spinner{display:inline-block;width:17px;height:17px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#1d1d1f;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;font-weight:500;opacity:0;transition:transform .3s,opacity .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.error-msg{color:#ff3b30;font-size:13px;margin-top:10px;display:none}
.data-status{font-size:13px;color:#6e6e73;margin-bottom:14px;text-align:center}
.data-status.error{color:#ff3b30}
.usage{display:none;font-size:12px;color:#6e6e73;text-align:right;margin-top:10px;font-variant-numeric:tabular-nums}
.usage.warn{color:#c76a00;font-weight:600}
.usage.danger{color:#ff3b30;font-weight:600}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>파이 CS 답변 도우미</h1>
    <p>고객 문의 내용을 입력하면 과거 응대 사례를 찾아 답변 초안을 만듭니다</p>
  </header>

  <div class="card">
    <div id="dataStatus" class="data-status">사례 데이터를 불러오는 중…</div>
    <label for="question">고객 문의 내용</label>
    <textarea id="question" placeholder="고객이 문의한 내용을 입력하세요..."></textarea>
    <div class="char-count"><span id="charCount">0</span>자</div>
    <button class="btn-primary" id="generateBtn" disabled>답변 초안 생성</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="usage" id="usageInfo"></div>
  </div>

  <div class="card result-card" id="resultCard">
    <div class="result-header">
      <span>생성된 답변 초안</span>
      <span class="badge" id="confidenceBadge"></span>
    </div>
    <div id="answerBox"></div>
    <div class="actions">
      <button id="copyBtn">📋 복사</button>
      <button class="dark" id="regenBtn">🔄 다시 생성</button>
    </div>
    <details id="refCases" style="display:none">
      <summary id="refSummary">참고한 사례</summary>
      <ul id="refList"></ul>
    </details>
  </div>
</div>

<div class="toast" id="toast">클립보드에 복사됐어요</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
